[project]
name = "quant-control-bench"
version = "0.1.0"
description = "How few bits does a closed-loop robot controller need before it falls over? A reproducible post-training quantization benchmark for RL control policies on a 4GB GPU, with a prescriptive precision recommender."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.scripts]
qcb = "quant_control_bench.cli:main"

[project.optional-dependencies]
# MuJoCo Playground (PyPI name is `playground`, import name `mujoco_playground`)
# plus its CUDA JAX stack. This is the training/eval environment.
sim = [
    "playground[cuda]>=0.2.0",
    # jax is pinned below 0.10 on purpose. Brax 0.14.2 (the newest release) still
    # calls jax.device_put_replicated, which JAX removed in 0.10.0; on 0.11 the
    # PPO trainer dies at startup with an AttributeError. 0.9.2 keeps the symbol
    # as a deprecation. Lift this pin once Brax ships its pmap migration.
    "jax[cuda12]==0.9.2",
]
# ONNX export + CPU reference runtime for the Python-side parity test.
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
plots = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_control_bench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
# The simulator stack (jax, mujoco_playground, brax) ships no type stubs and is
# an optional extra, so a missing import is a warning, not a build failure.
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: excluded from `make verify`; real training or full sweeps",
    "gpu: requires a CUDA device",
]
