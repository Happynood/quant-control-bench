<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="quant-control-bench: how few bits does a closed-loop robot controller need before it falls over?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="stair" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="696" y2="0">
      <stop offset="0%" stop-color="#7fd4a0"/>
      <stop offset="55%" stop-color="#6fb9c9"/>
      <stop offset="100%" stop-color="#e77c7c"/>
    </linearGradient>
    <g id="dog">
      <!-- trunk -->
      <rect x="-26" y="-14" width="52" height="17" rx="6" fill="currentColor"/>
      <!-- head -->
      <rect x="20" y="-19" width="17" height="13" rx="4" fill="currentColor"/>
      <!-- legs -->
      <path d="M-18 3 l-5 15 M-6 3 l3 15 M8 3 l-4 15 M20 3 l5 15"
            stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>

  <!-- Descending precision: each step is a real scheme from the benchmark. -->
  <g transform="translate(72 262)">
    <g fill="url(#stair)" opacity="0.92">
      <rect x="0"   y="-150" width="112" height="150" rx="5"/>
      <rect x="128" y="-118" width="112" height="118" rx="5"/>
      <rect x="256" y="-86"  width="112" height="86"  rx="5"/>
      <rect x="384" y="-54"  width="112" height="54"  rx="5"/>
      <rect x="512" y="-22"  width="112" height="22"  rx="5"/>
    </g>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
       font-size="17" fill="#8d9bb0" text-anchor="middle">
      <text x="56"  y="26">fp32</text>
      <text x="184" y="26">fp16</text>
      <text x="312" y="26">int8</text>
      <text x="440" y="26">int4</text>
      <text x="568" y="26">ternary</text>
    </g>

    <!-- Upright on every step that the measurements say holds. -->
    <g color="#dbe3ee">
      <use href="#dog" transform="translate(56 -170)"/>
      <use href="#dog" transform="translate(184 -138)"/>
      <use href="#dog" transform="translate(312 -106)"/>
      <use href="#dog" transform="translate(440 -74)"/>
    </g>
    <!-- And over on the one that does not: ternary loses 90.7% of its return. -->
    <g color="#e77c7c">
      <use href="#dog" transform="translate(590 -26) rotate(78)"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="712" y="132" font-size="40" font-weight="700" fill="#dbe3ee">quant-control-bench</text>
    <text x="712" y="176" font-size="21" fill="#7fd4a0">How few bits does a closed-loop</text>
    <text x="712" y="204" font-size="21" fill="#7fd4a0">robot controller need before it falls over?</text>
    <text x="712" y="248" font-size="16" fill="#8d9bb0">Go1 locomotion · 9 precisions · real MuJoCo physics</text>
    <text x="712" y="272" font-size="16" fill="#8d9bb0">bootstrap intervals on every delta</text>
  </g>
</svg>
