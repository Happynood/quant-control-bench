name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The `onnx` extra is installed because the Python<->ONNX parity check is a
      # mandatory gate and runs entirely on CPU — it belongs in CI, not only on
      # the machine with the GPU. The `sim` extra is not: it pulls CUDA JAX and
      # MuJoCo Playground, and the runner has no GPU, so the simulator-dependent
      # tests skip themselves via importorskip and the end-to-end smoke pipeline
      # runs locally in `make verify`.
      - name: Install dependencies
        run: uv sync --dev --extra onnx

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q -m "not slow and not gpu"
