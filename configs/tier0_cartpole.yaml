# Tier 0, full pipeline in miniature (train -> export -> parity -> eval).
name: tier0-cartpole
env: CartpoleBalance
schemes:
  - fp32
  - fp16
  - int8-tensor
  - int8-channel
  - int4-channel
  - int4-group32
  - ternary
  - mixed-head-fp16
  - int8-act
perturbations: []
train:
  # Playground's tuned value for this env. Measured to fit well inside the
  # 4 GB budget (peak 927 MiB observed).
  num_envs: 2048
  seed: 0
eval:
  episodes: 100
  seeds: [0, 1, 2, 3, 4]
